<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Matches the in-game sky so any letterbox edges blend in */
      background: linear-gradient(180deg, #1E0F3C 0%, #4B2A85 55%, #B979C9 100%);
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
    canvas { display: block; }
  </style>
  <!-- Panel styles (resume info panel + ending) -->
  <link rel="stylesheet" href="./src/ui/infoPanel.css" />
  <link rel="stylesheet" href="./src/ui/ending.css" />
  <!-- Lets `import Phaser from 'phaser'` work on GitHub Pages without a build step -->
  <script type="importmap">
    { "imports": { "phaser": "./vendor/phaser/phaser.js" } }
  </script>
</head>
<body>
  <div id="game-container"></div>
  <!-- Relative path so it works at https://<user>.github.io/<repo>/ -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
